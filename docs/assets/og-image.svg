<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Artifact Gallery for OpenChamber</title>
  <desc id="description">The work outlives the conversation. Artifact Gallery shown inside OpenChamber.</desc>
  <defs>
    <style>
      @font-face{font-family:Geist;src:url('../../assets/geist-400.woff2') format('woff2');font-weight:400}
      @font-face{font-family:Geist;src:url('../../assets/geist-600.woff2') format('woff2');font-weight:600}
      text{font-family:Geist,sans-serif}
    </style>
    <clipPath id="product-frame">
      <rect x="60" y="174" width="1080" height="416" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f6f6f4"/>

  <g transform="translate(40 30)">
    <rect width="30" height="30" rx="7" fill="#42634e"/>
    <g transform="translate(2.2 2.2) scale(.4)" fill="none" stroke="#f6f6f4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="14" width="36" height="36" rx="6"/>
      <circle cx="25" cy="25" r="4"/>
      <path d="m49 39-8.2-8.2a4 4 0 0 0-5.7 0L19 47"/>
    </g>
  </g>
  <text x="82" y="52" font-size="18" font-weight="600" fill="#262626">Artifact Gallery <tspan font-weight="400" fill="#626262">for OpenChamber</tspan></text>
  <text x="40" y="130" font-size="48" font-weight="600" letter-spacing="-2.64" fill="#262626">The work outlives the conversation.</text>

  <rect x="60" y="174" width="1080" height="416" rx="10" fill="#171717"/>
  <image href="host-gallery.png" x="60" y="174" width="1080" height="720" preserveAspectRatio="xMinYMin slice" clip-path="url(#product-frame)"/>
  <rect x="60.5" y="174.5" width="1079" height="415" rx="9.5" fill="none" stroke="#d4d4d4"/>
</svg>
