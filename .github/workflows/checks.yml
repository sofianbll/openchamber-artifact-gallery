name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test src/gallery.test.ts
      - run: bun run build
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-package-lock --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$(node -e "console.log(require('$RUNNER_TEMP/browser/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Browser interactions and loading bounds
        env:
          GALLERY_TEST_OUTPUT: ${{ runner.temp }}/gallery-browser
        run: |
          bun test/browser.ts
          bun test/benchmark.ts
      - name: Installable package
        run: |
          bun run package "$RUNNER_TEMP/gallery-package"
          bun test/package.ts "$RUNNER_TEMP/gallery-package"
