name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify version and tests
        run: |
          test "$GITHUB_REF_NAME" = "v$(bun -p 'require("./package.json").version')"
          bun test src/gallery.test.ts
      - name: Build and verify prebuilt archive
        run: |
          bun run package "$RUNNER_TEMP/openchamber-artifact-gallery-${GITHUB_REF_NAME#v}"
          git ls-files --error-unmatch panel/main.js service/main.js
          git diff --exit-code -- panel/main.js service/main.js
          bun test/package.ts "$RUNNER_TEMP/openchamber-artifact-gallery-${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/openchamber-artifact-gallery-${GITHUB_REF_NAME#v}.tar.gz"
          "$RUNNER_TEMP/openchamber-artifact-gallery-${GITHUB_REF_NAME#v}.tar.gz.sha256"
          --title "Artifact Gallery $GITHUB_REF_NAME"
          --notes-file CHANGELOG.md
